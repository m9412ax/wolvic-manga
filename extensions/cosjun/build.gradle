// Cosjun Mihon-format extension for Wolvic's source loader.
// The source-api ABI classes are provided by the host at runtime, so they MUST
// be compileOnly here — do not package them or DelegateLastClassLoader will
// load a private copy that is type-incompatible with the host.
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace = 'eu.kanade.tachiyomi.extension.zh.cosjun'
    compileSdk = 36

    defaultConfig {
        applicationId = 'eu.kanade.tachiyomi.extension.zh.cosjun'
        minSdk = 26
        targetSdk = 34
        versionCode = 1
        // substringBeforeLast('.') -> "1.6", matching host SUPPORTED_LIB_VERSIONS.
        versionName = '1.6.0'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }

    // Use the AGP default debug signing (CI injects ~/.android/debug.keystore).
    // The Wolvic host does not verify extension signatures, so any valid one works.
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // ABI + all transitive libraries (okhttp/jsoup/coroutines/injekt/
    // serialization) come through source-api's `api` elements. Do NOT re-declare
    // them here: a differing coroutines version caused a strict BOM conflict.
    compileOnly project(':source-api')
    // jsoup is `implementation` in source-api (not exported); declare it here
    // at the SAME version so Document/select and the asJsoup() extension compile.
    compileOnly 'org.jsoup:jsoup:1.23.2'
    // Preference UI classes are implementation-only in source-api; the host
    // provides them at runtime, so compileOnly keeps them out of the APK.
    compileOnly 'androidx.preference:preference-ktx:1.2.1'
}
