// Cosjun Mihon-format extension for Wolvic's source loader.
// The source-api ABI classes are provided by the host at runtime, so they MUST
// be compileOnly here — do not package them or DelegateLastClassLoader will
// load a private copy that is type-incompatible with the host.
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace = 'eu.kanade.tachiyomi.extension.zh.cosjun'
    compileSdk = 36

    defaultConfig {
        applicationId = 'eu.kanade.tachiyomi.extension.zh.cosjun'
        minSdk = 26
        targetSdk = 34
        versionCode = 1
        // substringBeforeLast('.') -> "1.6", matching host SUPPORTED_LIB_VERSIONS.
        versionName = '1.6.0'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }

    // Use the AGP default debug signing (CI injects ~/.android/debug.keystore).
    // The Wolvic host does not verify extension signatures, so any valid one works.
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // ABI + transitive libraries: compile-time only, never packaged.
    compileOnly project(':source-api')
    compileOnly 'com.squareup.okhttp3:okhttp:5.3.0'
    compileOnly 'org.jsoup:jsoup:1.23.2'
    compileOnly 'org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.7.3'
    compileOnly 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
    compileOnly 'uy.kohesive.injekt:injekt-core:1.16.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'
}
