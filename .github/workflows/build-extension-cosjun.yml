name: Build Cosjun Extension

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Cosjun mihon extension APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Build extension
        run: ./gradlew :extensions:cosjun:assembleRelease --stacktrace

      - name: Upload extension APK
        uses: actions/upload-artifact@v4
        with:
          name: cosjun_extension
          path: extensions/cosjun/build/outputs/apk/
