// Mihon/Tachiyomi extension ABI layer, ported from saber1008611/mihon-webdav
// (source-api + core/common network/preference/util). Package names and public
// signatures are kept identical so installed keiyoushi 1.4/1.6 extension APKs
// load against these classes through DelegateLastClassLoader.
apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlinx-serialization'

android {
    namespace = 'com.igalia.wolvic.sourceapi'
    compileSdk = 36

    defaultConfig {
        minSdk = 26
        consumerProguardFiles 'consumer-proguard.pro'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
        freeCompilerArgs += [
                '-opt-in=kotlinx.coroutines.DelicateCoroutinesApi',
                '-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi',
                '-opt-in=kotlinx.coroutines.FlowPreview',
        ]
    }
}

dependencies {
    api libs.kotlin.stdlib
    api libs.kotlin.coroutines
    api "org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json-okio:1.11.0"
    api "com.squareup.okhttp3:okhttp:5.5.0"
    implementation "com.squareup.okhttp3:okhttp-brotli:5.5.0"
    implementation "com.squareup.okhttp3:okhttp-zstd:5.5.0"
    implementation "com.squareup.okhttp3:logging-interceptor:5.5.0"
    implementation "com.squareup.okhttp3:okhttp-dnsoverhttps:5.5.0"
    api "uy.kohesive.injekt:injekt-core:1.16.1"
    implementation "io.reactivex:rxjava:1.3.8"
    implementation "org.jsoup:jsoup:1.23.2"
    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation "androidx.webkit:webkit:1.17.0"
    api "com.squareup.logcat:logcat:0.4"
}